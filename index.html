<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Langkah – Pelacak Aktivitas & Analisis Tubuh</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f4;--sf:#fff;--ink:#242428;--mut:#6d6d78;--ac:#fc4c02;--ac2:#fc4c02;--ln:#e4e4e8;--ok:#1a9b5a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--sf:#1e1e22;--ink:#f2f2f4;--mut:#9a9aa6;--ac:#ff6a2b;--ac2:#ff6a2b;--ln:#2e2e34;--ok:#4cd08a}}
:root[data-theme="dark"]{--bg:#121214;--sf:#1e1e22;--ink:#f2f2f4;--mut:#9a9aa6;--ac:#ff6a2b;--ac2:#ff6a2b;--ln:#2e2e34;--ok:#4cd08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;font-weight:800;margin:4px 0 14px;letter-spacing:-.02em}
h2{font-size:1.05rem;font-weight:600;margin:0 0 10px}
.card{background:var(--sf);border-radius:12px;padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.big{font-size:2.4rem;font-weight:800;line-height:1}
.mut{color:var(--mut);font-size:.88rem}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;cursor:pointer;width:100%;margin-top:12px}

button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.sm{width:auto;margin:0;padding:6px 10px;font-size:.8rem;background:transparent;color:var(--mut);border:1px solid var(--ln)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{margin:0;background:transparent;color:var(--mut);padding:10px 4px;border-radius:10px}
nav button[aria-current="page"]{color:var(--ac)}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--ln);gap:8px}
.item:first-of-type{border-top:0}
.tip{border-left:4px solid var(--ac2);padding:8px 12px;margin:8px 0;background:var(--bg);border-radius:0 10px 10px 0}
.tip.ok{border-color:var(--ok)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--ln)}
.hide{display:none}
svg text{fill:var(--mut);font-family:inherit;font-size:11px}
.feed{padding:0;overflow:hidden}
.fh{display:flex;gap:12px;padding:14px 16px 8px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:1.2rem;flex:none}
.ft{font-weight:700;font-size:1.05rem;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px 16px}
.stats b{display:block;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.stats span{font-size:.75rem;color:var(--mut)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;overflow:visible}
nav button .ic{font-size:1.3rem;line-height:1.1}
nav button.rec .dot{width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:400;margin-top:-26px;box-shadow:0 4px 12px rgba(252,76,2,.45)}
#map{height:260px;border-radius:12px;overflow:hidden;background:var(--bg);margin-top:12px}
.rec-btn{width:124px;height:124px;border-radius:50%;display:block;margin:18px auto 0;font-size:1.1rem}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fc4c02">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const TYPES={Jalan:3.5,Lari:9,Sepeda:7,Renang:7,Gym:5,Yoga:2.5};
const INT={Ringan:.8,Sedang:1,Berat:1.25};
const DAYS=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
let cloud=null,sync="local",known=new Set(),lastP="";
let S={profile:{sex:"m",age:30,h:170,w:65,goal:"jaga"},acts:[]};
let tab="home",gps=null;
try{const r=localStorage.getItem("langkah");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("langkah",JSON.stringify(S))}catch(e){}push()};
const label=()=>sync==="cloud"?"Tersinkron ke akun claude.ai kamu":"Data tersimpan di perangkat ini";
const paintSync=()=>{const e=document.querySelector("#sync");if(e)e.textContent=label()};
function push(){if(!cloud)return;try{
 S.acts.forEach(a=>{const k=String(a.id);if(!known.has(k)){known.add(k);cloud.doc(k).set(a).catch(()=>{})}});
 [...known].forEach(k=>{if(!S.acts.some(a=>String(a.id)===k)){known.delete(k);cloud.doc(k).delete().catch(()=>{})}});
 const p=JSON.stringify(S.profile);if(p!==lastP){lastP=p;cloud.doc("p").set(S.profile).catch(()=>{})}}catch(e){}}
async function initSync(){try{
 const u=await claude.use("user"),db=await claude.use("db");if(!u||!db)return;
 const col=db.collection("data/users/"+await u.id());let first=true;
 col.onSnapshot(snap=>{const acts=[];let prof=null;
  snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id==="p")prof=x;else acts.push(x)});
  cloud=col;sync="cloud";
  if(first&&!snap.docs.length){first=false;save();paintSync();return}
  first=false;acts.sort((a,b)=>a.date-b.date);S.acts=acts;if(prof)S.profile=prof;
  known=new Set(acts.map(a=>String(a.id)));lastP=prof?JSON.stringify(prof):"";
  try{localStorage.setItem("langkah",JSON.stringify(S))}catch(e){}
  const ae=document.activeElement;if(!ae||!/INPUT|SELECT/.test(ae.tagName))render();else paintSync()},
  ()=>{sync="local";paintSync()})}catch(e){}}
const $=(s)=>document.querySelector(s);
const dkey=(d)=>{d=new Date(d);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const kcal=(t,min,i,w)=>Math.round(TYPES[t]*INT[i]*w*min/60);
function calc(){const p=S.profile,bmi=p.w/Math.pow(p.h/100,2);
 const bmr=10*p.w+6.25*p.h-5*p.age+(p.sex==="m"?5:-161);
 const cat=bmi<18.5?"Di bawah normal":bmi<25?"Normal":bmi<30?"Di atas normal":"Obesitas";
 return{bmi,bmr,cat,wmin:Math.round(18.5*Math.pow(p.h/100,2)),wmax:Math.round(24.9*Math.pow(p.h/100,2))}}
function week(){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);
 const as=S.acts.filter(a=>dkey(a.date)===dkey(d));
 out.push({d,min:as.reduce((s,a)=>s+a.min,0),kc:as.reduce((s,a)=>s+a.kc,0),km:as.reduce((s,a)=>s+(a.km||0),0)})}return out}
function ring(pct,val,sub){const r=52,c=2*Math.PI*r,o=c*(1-Math.min(pct,1));
 return `<svg viewBox="0 0 130 130" width="130" height="130" role="img" aria-label="Progres ${Math.round(pct*100)} persen"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--ln)" stroke-width="12"/><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 65 65)"/><text x="65" y="68" text-anchor="middle" style="font-size:26px;font-weight:800;fill:var(--ink)">${val}</text><text x="65" y="86" text-anchor="middle">${sub}</text></svg>`}
function bars(w){const mx=Math.max(30,...w.map(x=>x.min));
 return `<svg viewBox="0 0 280 120" width="100%" role="img" aria-label="Menit aktif 7 hari terakhir">`+w.map((x,i)=>{const h=Math.round(x.min/mx*80),X=i*40+8;
 return `<rect x="${X}" y="${90-h}" width="26" height="${Math.max(h,2)}" rx="6" fill="${i===6?"var(--ac)":"var(--mut)"}" fill-opacity="${i===6?1:.35}"/><text x="${X+13}" y="108" text-anchor="middle">${DAYS[x.d.getDay()]}</text>${x.min?`<text x="${X+13}" y="${84-h}" text-anchor="middle">${x.min}</text>`:""}`}).join("")+`</svg>`}
function insights(){const c=calc(),w=week(),tot=w.reduce((s,x)=>s+x.min,0),act=w.filter(x=>x.min>0).length,p=S.profile,t=[];
 t.push([tot>=150,tot>=150?`Kamu mencapai ${tot} menit minggu ini, di atas anjuran WHO (150 menit/minggu).`:`Baru ${tot} menit minggu ini. Anjuran WHO minimal 150 menit aktivitas sedang per minggu; tambah ${150-tot} menit lagi.`]);
 if(S.acts.length&&act<3)t.push([false,`Kamu aktif hanya ${act} hari dalam 7 hari. Usahakan 3–5 hari agar kebugaran terbentuk.`]);
 if(act>=6)t.push([false,"Aktif hampir setiap hari. Sisipkan 1 hari istirahat atau aktivitas ringan agar otot pulih."]);
 const heavy=w.reduce((s,x)=>s+x.min,0);if(heavy>420)t.push([false,"Volume minggu ini tinggi (>7 jam). Naikkan beban bertahap maksimal 10% per minggu untuk mengurangi risiko cedera."]);
 if(c.bmi>=25&&p.goal!=="naik")t.push([false,`BMI ${c.bmi.toFixed(1)} (${c.cat}). Berat sehat untuk tinggimu sekitar ${c.wmin}–${c.wmax} kg. Kombinasikan aktivitas dengan defisit kalori kecil (300–500 kkal/hari).`]);
 else if(c.bmi<18.5)t.push([false,`BMI ${c.bmi.toFixed(1)} (${c.cat}). Pastikan asupan kalori cukup dan sertakan latihan beban.`]);
 else t.push([true,`BMI ${c.bmi.toFixed(1)} masuk rentang normal. Pertahankan.`]);
 const kc=w.reduce((s,x)=>s+x.kc,0);if(kc)t.push([true,`Total ${kc} kkal terbakar dari olahraga 7 hari terakhir.`]);
 return t.map(([ok,m])=>`<div class="tip ${ok?"ok":""}">${m}</div>`).join("")}

const EMO={Jalan:"🚶",Lari:"🏃",Sepeda:"🚴",Renang:"🏊",Gym:"🏋️",Yoga:"🧘"};
const hhmm=(m)=>m>=60?Math.floor(m/60)+"j "+(m%60)+"m":m+"m";
const title=(a)=>{const h=new Date(a.date).getHours();return a.type+" "+(h<11?"Pagi":h<15?"Siang":h<18?"Sore":"Malam")};
function third(a){if(!a.km||!a.min)return["Intensitas",a.int];
 if(a.type==="Sepeda")return["Kecepatan",(a.km/(a.min/60)).toFixed(1)+" km/j"];
 const s=Math.round(a.min/a.km*60);return["Pace",Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" /km"]}
function feedCard(a){const t=third(a);
 return `<div class="card feed"><div class="fh"><div class="av">${EMO[a.type]||"🏅"}</div><div><div class="ft">${title(a)}</div><div class="mut">${new Date(a.date).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"})}</div></div></div>
<div class="stats"><div><b>${a.km?a.km.toFixed(2)+" km":a.kc+" kkal"}</b><span>${a.km?"Jarak":"Energi"}</span></div><div><b>${t[1]}</b><span>${t[0]}</span></div><div><b>${hhmm(a.min)}</b><span>Waktu</span></div></div></div>`}
function home(){const w=week(),tm=w.reduce((s,x)=>s+x.min,0),km=w.reduce((s,x)=>s+x.km,0),kc=w.reduce((s,x)=>s+x.kc,0);
 return `<h1>Beranda</h1><div class="card"><h2>Minggu ini</h2><div class="stats" style="padding:0 0 8px"><div><b>${km.toFixed(1)} km</b><span>Jarak</span></div><div><b>${hhmm(tm)}</b><span>Waktu</span></div><div><b>${kc}</b><span>kkal</span></div></div>${bars(w)}<p class="mut" style="margin:0">${tm} dari 150 menit target mingguan</p></div>
<div class="card"><h2>Analisis tubuh & aktivitas</h2>${insights()}</div>
<h2 style="margin:18px 4px 10px">Aktivitas terbaru</h2>${S.acts.length?S.acts.slice().reverse().slice(0,10).map(feedCard).join(""):`<div class="card"><p class="mut" style="margin:0">Belum ada aktivitas. Tekan tombol oranye untuk mulai merekam.</p></div>`}`}

function log(){const rec=gps&&gps.on;
 return `<h1>Rekam aktivitas</h1><div class="card"><h2>Rekam dengan GPS</h2><p class="mut">Untuk jalan, lari, atau sepeda di luar ruangan. Layar dijaga tetap menyala selama merekam; biarkan tab ini terbuka. Jika izin lokasi terhalang pesan overlay, matikan gelembung chat atau filter layar sebentar.</p>
 <label>Jenis</label><select id="gt">${["Jalan","Lari","Sepeda"].map(t=>`<option>${t}</option>`).join("")}</select>
 <div id="gst" class="${rec?"":"hide"}" style="margin-top:12px"><div class="big" id="gk">0.00</div><div class="mut">km · <span id="gm">0:00</span></div></div>
 <div id="map" class="${rec?"":"hide"}"></div><button id="gb" class="${rec?"g":"p"} rec-btn">${rec?"Selesai":"Mulai"}</button></div>
 <div class="card"><h2>Input manual</h2>
 <label>Jenis</label><select id="mt">${Object.keys(TYPES).map(t=>`<option>${t}</option>`).join("")}</select>
 <div class="row"><div><label>Durasi (menit)</label><input id="md" type="number" min="1" value="30" inputmode="numeric"></div><div><label>Jarak (km)</label><input id="mk" type="number" min="0" step="0.1" value="0" inputmode="decimal"></div></div>
 <label>Intensitas</label><select id="mi">${Object.keys(INT).map(t=>`<option ${t==="Sedang"?"selected":""}>${t}</option>`).join("")}</select>
 <button id="mb" class="p">Simpan aktivitas</button></div>
 <div class="card"><h2>Riwayat</h2>${S.acts.length?S.acts.slice().reverse().slice(0,15).map(a=>`<div class="item"><div><strong>${a.type}</strong> <span class="pill">${a.int}</span><div class="mut">${new Date(a.date).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})} · ${a.min} mnt · ${a.km?a.km.toFixed(2)+" km · ":""}${a.kc} kkal</div></div><button class="sm" data-del="${a.id}" aria-label="Hapus">Hapus</button></div>`).join(""):`<p class="mut">Belum ada aktivitas. Mulai dengan satu sesi 20 menit.</p>`}</div>`}

function body(){const p=S.profile,c=calc(),tdee=Math.round(c.bmr*1.375);
 const g=p.goal==="turun"?tdee-500:p.goal==="naik"?tdee+300:tdee;
 return `<h1>Profil tubuh</h1><div class="card"><div class="row"><div><label>Jenis kelamin</label><select id="ps"><option value="m" ${p.sex==="m"?"selected":""}>Laki-laki</option><option value="f" ${p.sex==="f"?"selected":""}>Perempuan</option></select></div><div><label>Usia</label><input id="pa" type="number" value="${p.age}" inputmode="numeric"></div></div>
 <div class="row"><div><label>Tinggi (cm)</label><input id="ph" type="number" value="${p.h}" inputmode="numeric"></div><div><label>Berat (kg)</label><input id="pw" type="number" step="0.1" value="${p.w}" inputmode="decimal"></div></div>
 <label>Tujuan</label><select id="pg"><option value="turun" ${p.goal==="turun"?"selected":""}>Turunkan berat</option><option value="jaga" ${p.goal==="jaga"?"selected":""}>Jaga berat</option><option value="naik" ${p.goal==="naik"?"selected":""}>Naikkan massa</option></select>
 <button id="pb" class="p">Simpan profil</button></div>
 <div class="card"><h2>Hasil analisis</h2><div class="row"><div><div class="big">${c.bmi.toFixed(1)}</div><div class="mut">BMI · ${c.cat}</div></div><div><div class="big">${Math.round(c.bmr)}</div><div class="mut">kkal BMR / hari</div></div></div>
 <p class="mut">Berat sehat untuk tinggimu: ${c.wmin}–${c.wmax} kg.<br>Perkiraan kebutuhan kalori (aktivitas ringan–sedang): <strong>${tdee} kkal</strong>. Target sesuai tujuan: <strong>${g} kkal/hari</strong>.</p>
 <p class="mut">Perhitungan memakai rumus Mifflin-St Jeor dan nilai MET. Ini estimasi, bukan diagnosis medis. Konsultasikan ke dokter bila punya kondisi kesehatan khusus.</p></div>
 <div class="card"><h2>Data</h2><button id="xb" class="g">Hapus semua aktivitas</button></div>`}

function render(){
 $("#app").innerHTML=`<div id="sync" class="mut" style="text-align:right;font-size:.75rem">${label()}</div>`+(tab==="home"?home():tab==="log"?log():body());
 $("#nav").innerHTML=[["home","Beranda","⌂"],["log","Rekam","+"],["body","Kamu","☺"]].map(([k,l,ic])=>`<button data-t="${k}" class="${k==="log"?"rec":""}" ${tab===k?'aria-current="page"':""}>${k==="log"?`<div class="dot">${ic}</div>`:`<div class="ic">${ic}</div>`}${l}</button>`).join("");
 bind();updMap()}
function bind(){
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{S.acts=S.acts.filter(a=>a.id!=b.dataset.del);save();render()});
 if($("#mb"))$("#mb").onclick=()=>{const min=+$("#md").value,km=+$("#mk").value||0;if(!(min>0))return alert("Isi durasi lebih dari 0 menit.");
  const t=$("#mt").value,i=$("#mi").value;S.acts.push({id:Date.now(),date:Date.now(),type:t,min,km,int:i,kc:kcal(t,min,i,S.profile.w)});save();tab="home";render()};
 if($("#gb"))$("#gb").onclick=toggleGps;
 if($("#pb"))$("#pb").onclick=()=>{const p={sex:$("#ps").value,age:+$("#pa").value,h:+$("#ph").value,w:+$("#pw").value,goal:$("#pg").value};
  if(!(p.age>0&&p.h>50&&p.w>20))return alert("Periksa kembali usia, tinggi, dan berat.");S.profile=p;save();render()};
 if($("#xb"))$("#xb").onclick=()=>{if(confirm("Hapus semua riwayat aktivitas?")){S.acts=[];save();render()}}}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);
 const q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
let LM=null,mapEl=null,lyr=null,mk=null,leaflet="idle";
function loadLeaflet(){if(leaflet!=="idle")return;leaflet="loading";
 const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";
 l.onload=()=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
  s.onload=()=>{leaflet="ok";updMap()};s.onerror=()=>{leaflet="fail"};document.head.appendChild(s)};
 l.onerror=()=>{leaflet="fail"};document.head.appendChild(l)}
function svgRoute(el){const P=gps.pts,a=P.map(x=>x[0]),b=P.map(x=>x[1]);
 const la0=Math.min(...a),la1=Math.max(...a),lo0=Math.min(...b),lo1=Math.max(...b),k=Math.cos(la0*Math.PI/180),W=300,H=220,pad=24;
 const dx=Math.max((lo1-lo0)*k,1e-4),dy=Math.max(la1-la0,1e-4),sc=Math.min((W-2*pad)/dx,(H-2*pad)/dy);
 const X=lo=>(W/2+(lo-(lo0+lo1)/2)*k*sc).toFixed(1),Y=la=>(H/2-(la-(la0+la1)/2)*sc).toFixed(1),l=P[P.length-1];
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="Rute"><polyline points="${P.map(x=>X(x[1])+","+Y(x[0])).join(" ")}" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${X(l[1])}" cy="${Y(l[0])}" r="7" fill="var(--ac)" stroke="#fff" stroke-width="3"/></svg>`}
function updMap(){const el=document.querySelector("#map");if(!el||!gps||!gps.on)return;
 if(!gps.pts||!gps.pts.length){el.innerHTML='<p class="mut" style="padding:12px">Mencari sinyal GPS…</p>';return}
 const p=gps.pts[gps.pts.length-1];
 if(leaflet==="ok"&&window.L){
  if(mapEl!==el){try{LM&&LM.remove()}catch(e){}el.innerHTML="";LM=L.map(el,{zoomControl:false}).setView(p,17);
   L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(LM);
   lyr=L.polyline(gps.pts,{color:"#fc4c02",weight:5}).addTo(LM);
   mk=L.circleMarker(p,{radius:8,color:"#fff",weight:3,fillColor:"#fc4c02",fillOpacity:1}).addTo(LM);mapEl=el}
  else{lyr.setLatLngs(gps.pts);mk.setLatLng(p);LM.panTo(p)}
  return}
 if(leaflet==="idle")loadLeaflet();
 svgRoute(el)}
let wl=null;
async function lockScreen(){try{if("wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch(e){}}
function unlock(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&gps&&gps.on)lockScreen()});
function toggleGps(){
 if(gps&&gps.on){navigator.geolocation.clearWatch(gps.id);clearInterval(gps.tm);unlock();try{LM&&LM.remove()}catch(e){}LM=null;mapEl=null;
  const min=Math.max(1,Math.round((Date.now()-gps.t0)/60000)),t=gps.type,i="Sedang";
  S.acts.push({id:Date.now(),date:gps.t0,type:t,min,km:gps.km,int:i,kc:kcal(t,min,i,S.profile.w)});save();gps=null;tab="home";return render()}
 if(!navigator.geolocation)return alert("Perangkat ini tidak mendukung GPS di browser. Gunakan input manual.");
 gps={on:true,km:0,last:null,t0:Date.now(),type:$("#gt").value};lockScreen();
 gps.id=navigator.geolocation.watchPosition(pos=>{const c={lat:pos.coords.latitude,lon:pos.coords.longitude};
  if(pos.coords.accuracy>40)return;if(gps.last){const d=hav(gps.last,c);if(d>0.003)gps.km+=d,gps.last=c}else gps.last=c;
  if($("#gk"))$("#gk").textContent=gps.km.toFixed(2);gps.pts=gps.pts||[];if(gps.last===c)gps.pts.push([c.lat,c.lon]);updMap()},()=>{unlock();alert("Izin lokasi gagal. Jika muncul pesan \"overlay\", matikan gelembung chat atau filter layar dulu. Atau buka Pengaturan > Aplikasi > Chrome > Izin > Lokasi > Izinkan, lalu coba lagi.");
  clearInterval(gps.tm);gps=null;render()},{enableHighAccuracy:true});
 gps.tm=setInterval(()=>{const s=Math.floor((Date.now()-gps.t0)/1000);if($("#gm"))$("#gm").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000);render()}
render();initSync();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
